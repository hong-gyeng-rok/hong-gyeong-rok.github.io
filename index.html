<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kimgupall_98</title>
        <link rel="stylesheet" href="kim98_web_site/css/reset.css" />
        <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
        <link rel="stylesheet" href="kim98_web_site/css/style.css" />
        <link rel="stylesheet" href="kim98_web_site/css/loader.css" />
        <link rel="stylesheet" href="kim98_web_site/css/popup_modal.css" />
        <link rel="stylesheet" href="kim98_web_site/css/profile.css" />
        <link rel="stylesheet" href="kim98_web_site/css/popup.css" />
        <link rel="stylesheet" href="kim98_web_site/css/links.css" />
        <link rel="stylesheet" href="kim98_web_site/css/gallery.css" />
    </head>
    <body>
        <!--팝업 모달창-->
        <section id="popup_modal" class="popup_modal "> 
            <div id="modal_area" class="modal_area modal_area ">
                <!--close 버튼-->
                <button class=" modal_close">
                    <img src="kim98_web_site/kim98_images/icons_op_0/backwrod_icon.png" alt = "backwrod" class=" icons_size">
                </button>
                <!--굿즈 출시 맨트 및 굿즈샵 이동 아이콘 파트-->
                <div id="merch_ment" class="merch_ment">
                    <!--굿즈 맨트 및 아이콘 모음-->
                    <p>작가 굿즈 출시 클릭시 이동! </p> <img src="/kim98_web_site/kim98_images/icons_op_0/arrow_slim.png" alt="화살표 아이콘" class="icons_size "/> 
                    <button class=" merch_icon_modal">
                        <a href="https://naver.me/53lmTjmx">
                                <img src="kim98_web_site/kim98_images/icons_op_0/shopping_icon.png" alt="Merch icon" alt="Merch 아이콘"class="icons_size style_hover  ">
                        </a>
                    </button>    
                </div>
                <!--전시회 출시 멘트 및 이동 아이콘-->
                <div id="gallery_ment" class="gallery_ment">
                    <!--전시회 맨트 및 아이콘 모음-->
                    <p>전시회 페이지 출시 클릭시 이동!</p> <img src="/kim98_web_site/kim98_images/icons_op_0/arrow_slim.png" alt="화살표 아이콘" class="icons_size"/>
                    <button class="gallery_icon_modal">
                        <img src="kim98_web_site/kim98_images/icons_op_0/album_icon.png" alt="gallery_icon" class="gallery_icon_modal icons_size style_hover">
                    </button> 
                </div>
            </div>
        </section>
        <main id="main">
            <!-- 프로필 영역 -->
            <section id="profile" class="profile">
                <div class="profile_banner">
                    <div class="banner_img" id="imageBox" >
                        <div class=" skeleton_main">

                        </div>
                    </div>
                    <div class="profile_icon_wrapper">
                        <img src="kim98_web_site/kim98_images/icons_op_0/profile_icon.png" alt="프로필 아이콘" class="profile_icon" />
                        <p class="profile_name">@kimgupall_98</p>
                    </div>
                </div>
            </section>

            <!-- 링크 영역 -->
            <section id="links" class="links">
                <!-- 아이콘 링크 영역 -->
                <div class="links_icons">
                    <!-- sub popup area -->
                    <div id="subs_popup" class="popup_section">
                        <a href="http://pf.kakao.com/_QGyxnn">
                            <img src="kim98_web_site/kim98_images/icons_op_0/subs_icon.png" alt="구독" class="subs_icon">
                        </a>
                        <!--구독 아이콘 문구-->
                        <p>Subs</p> 
                    </div>
                    <!--전시회 아이콘-->
                    <div class="gallery_icon">
                        <img src="kim98_web_site/kim98_images/icons_op_0/album_icon.png" alt="gallery_icon" class="gallery_icon">
                        <p>Gallery</p>
                    </div>
                    <!--about popup area -->
                    <section id="about_popup" class="popup_section">
                        <button class="about_btn popup_open">
                            <img src="kim98_web_site/kim98_images/icons_op_0/about_icon.png" alt="About" class="about_icon">
                        </button>
                        <p>About</p>
                        <!--about popup box -->
                        <div class="popup_box">
                            <button class="about_btn popup_close">
                                <img src="kim98_web_site/kim98_images/icons_op_0/backwrod_icon.png" alt = "backwrod" class="backwrod_icon">
                            </button>
                            <h1>About</h1>
                            <p class="popup_font_size">안녕하세요.</p>
                            <p class="popup_font_size">젊음을 그리는 일러스트 작가 김98의 공식 홈페이지입니다. </p>
                            <p class="popup_font_size">옷과 관련된 문의, 협업 관련 문의는 DM 또는 메일로 문의 부탁드립니다.</p>
                            <p class="popup_font_size">
                                E-mail adress: kimgupall98@gmail.com
                            </p>
                        </div>
                    </section>
                </div>
                <!-- 바 링크 영역 -->
                <div class="links_bars">
                    <!-- instagram bar -->
                    <div id="instagram_bar" class="bar_style">
                        <img src="kim98_web_site/kim98_images/icons_op_0/instagram_icon.png" alt="Instagram 아이콘"
                            class="icons_size icons_style" />
                        <a href="https://www.instagram.com/kimgupall_98"  class="bar_text">Instagram is here!!</a>
                    </div>
                    <!-- merch bar -->
                    <div id="merch_bar" class="bar_style">
                        <img src="kim98_web_site/kim98_images/icons_op_0/shopping_icon.png" alt="Merch icon" alt="Merch 아이콘"
                            class="icons_size icons_style">
                        <a href="https://naver.me/53lmTjmx" class="bar_text" >Merch is here!!</a>
                    </div>
                    <!-- notefolio bar -->
                    <div id="notefolio_bar" class="bar_style">
                        <img src="kim98_web_site/kim98_images/icons_op_0/notefolio_4.png" alt="Notefolio 아이콘"
                            class="icons_size icons_style notefolio_style" />
                        <a href="https://notefolio.net/kimgupall98"  class="bar_text">Notefolio is here!!</a>
                    </div>
                    <!-- pinterest bar -->
                    <div id="pinterast_bar" class="bar_style">
                        <img src="kim98_web_site/kim98_images/icons_op_0/pinterast_icon.png" alt="Pinterest 아이콘"
                            class="icons_size icons_style" />
                        <a href="https://kr.pinterest.com/kimgupall98/" class="bar_text">Pinterest is here!!</a>
                    </div>
                </div>
            </section>
            <!--전시회 섹션-->
            <section id="gallery_section" class="gallery_section">
                <select id="seasonSelect">
                    <option value="24year-24S/S">24S/S</option>
                    <option value="24year-24F/W">24F/W</option>
                    <option value="25year-25S/S" selected>25S/S</option>
                </select>

                <!-- 이미지 섹션 css로 그리드, 슬라이더 스타일 전환-->
                <div id="gallery" class="gallery">
                    <div id="gallery_container" class="gallery_container ">
                    </div>
                </div>
                <div id="gallery_navigation_bar" class="gallery_navigation_bar">
                    <button id="gallery_style_grid">Grid</button>
                    <button id="gallery_style_slider">Slider</button>
                    <button id="gallery_exit">Exit</button>
                </div>
            </section>
        </main>
        <script type="module" src="kim98_web_site/js/main.js"></script>
    </body>
</html>
